<!DOCTYPE html>
<html>
<head>
<title>Your Digital Gifts ✨</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#1d002b,#3a0ca3,#f72585);
    font-family:Poppins,sans-serif;
    color:white;
    text-align:center;
}

h1{
    margin-bottom:50px;
    font-size:40px;
}

.container{
    display:flex;
    gap:40px;
}

.card{
    width:260px;
    height:260px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-size:20px;
    cursor:pointer;
    transition:0.4s;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.card:hover{
    transform:translateY(-15px) scale(1.05);
}
</style>
</head>
<body>

<h1>I Can’t Be There… So I Made This For You 💌</h1>

<div class="container">
    <div class="card" onclick="go1()">🌹 A Garden Across The Distance</div>
    <div class="card" onclick="go2()">💖 A Message From My Heart</div>
    <div class="card" onclick="go3()">✨ Our Future Together</div>
</div>

<script>
function go1(){window.location.href="gift1.html";}
function go2(){window.location.href="gift2.html";}
function go3(){window.location.href="gift3.html";}
</script>

</body>
</html>
