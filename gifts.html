<!DOCTYPE html>
<html>
<head>
<title>Choose Your Gift 🎁</title>
<style>
body{
    margin:0;
    background:linear-gradient(135deg,#3a0ca3,#7209b7,#f72585);
    color:white;
    font-family:Poppins,sans-serif;
    text-align:center;
    padding-top:60px;
}

h1{
    font-size:40px;
    margin-bottom:40px;
}

.card{
    display:inline-block;
    width:250px;
    height:200px;
    margin:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:0.4s;
    padding-top:70px;
    font-size:22px;
}

.card:hover{
    transform:translateY(-10px) scale(1.05);
}
</style>
</head>
<body>

<h1>Choose Your First Gift 💝</h1>

<div class="card" onclick="go1()">🌹 Romantic Flowers</div>
<div class="card" onclick="go2()">📸 Our Beautiful Moment</div>
<div class="card" onclick="go3()">✨ A Special Surprise</div>

<script>
function go1(){window.location.href="gift1.html";}
function go2(){window.location.href="gift2.html";}
function go3(){window.location.href="gift3.html";}
</script>

</body>
</html>
