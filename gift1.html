<!DOCTYPE html>
<html>
<head>
  <title>Love Letter 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="letter-scene">
  <div class="letter-card">
    <h1>To My Love ❤️</h1>

    <div class="letter-content">
      <p>
        The moment you became part of my life,
        everything changed in the most beautiful way.
      </p>

      <p>
        You are my calm in chaos,
        my warmth on cold days,
        and the reason my heart feels full.
      </p>

      <p>
        Loving you is the easiest,
        most natural thing I have ever done.
      </p>

      <p class="signature">
        Forever yours,<br>
        Your Valentine 💕
      </p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
