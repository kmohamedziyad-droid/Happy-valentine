<!DOCTYPE html>
<html>
<head>
<title>Romantic Flowers 🌹</title>
<style>
body{
    margin:0;
    background:#1a001a;
    color:white;
    text-align:center;
    font-family:Poppins,sans-serif;
    overflow:hidden;
}

h1{
    margin-top:60px;
    font-size:40px;
}

.flower{
    position:absolute;
    font-size:30px;
    animation:fall 8s linear infinite;
}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(100vh);}
}
</style>
</head>
<body>

<h1>A Garden Just For You 🌹</h1>
<p>You deserve flowers every single day of your life.</p>

<script>
for(let i=0;i<25;i++){
    let f=document.createElement("div");
    f.className="flower";
    f.innerHTML="🌹";
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(f);
}
</script>

</body>
</html>
