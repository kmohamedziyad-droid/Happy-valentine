<!DOCTYPE html>
<html>
<head>
<title>A Garden For You 🌹</title>
<style>
body{
    margin:0;
    background:#0d001a;
    color:white;
    text-align:center;
    font-family:Poppins,sans-serif;
    overflow:hidden;
}

h1{
    margin-top:60px;
    font-size:40px;
}

.flower{
    position:absolute;
    font-size:28px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(110vh);}
}
</style>
</head>
<body>

<h1>If I Were There… I'd Bring You These 🌹</h1>
<p>Until I can hold you, let these digital roses fall for you.</p>

<script>
for(let i=0;i<40;i++){
    let f=document.createElement("div");
    f.className="flower";
    f.innerHTML="🌹";
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(4+Math.random()*6)+"s";
    document.body.appendChild(f);
}
</script>

</body>
</html>
