<!DOCTYPE html>
<html>
<head>
<title>For Nada ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: radial-gradient(circle at top,#ff4e88,#1a001a);
    font-family:'Poppins',sans-serif;
    color:white;
    text-align:center;
    overflow:hidden;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:60px;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    margin:15px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background:white;
    color:#ff2e63;
    font-weight:bold;
}

#yes:hover{
    transform:scale(1.15);
}

#no{
    background:black;
    color:white;
    position:absolute;
}
</style>
</head>
<body>

<h1>Nada… will you be my Valentine? 💖</h1>

<button id="yes" onclick="goNext()">Yes 💘</button>
<button id="no">No 😅</button>

<script>
function goNext(){
    window.location.href="gifts.html";
}

const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseover",function(){
    noBtn.style.left=Math.random()*80+"vw";
    noBtn.style.top=Math.random()*80+"vh";
});
</script>

</body>
</html>
