<!DOCTYPE html>
<html>
<head>
<title>Be My Valentine ❤️</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#ff6a88,#ff99ac);
    font-family: 'Segoe UI', sans-serif;
    color:white;
    text-align:center;
    overflow:hidden;
}

h1{
    font-size:42px;
    margin-bottom:40px;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    margin:15px;
    transition:0.3s;
}

#yes{
    background:white;
    color:#ff4e50;
    font-weight:bold;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:black;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<h1>Nada, will you be my Valentine? 💖</h1>

<button id="yes" onclick="goToGift1()">YES 💘</button>
<button id="no">NO 😅</button>

<script>
function goToGift1(){
    window.location.href = "gift1.html";
}

const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseover", function(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});
</script>

</body>
</html>
