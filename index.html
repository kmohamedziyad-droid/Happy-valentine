<!DOCTYPE html>
<html>
<head>
<title>For Nada ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:radial-gradient(circle at center,#ff4e88,#1a001f 70%);
    font-family:'Poppins',sans-serif;
    color:white;
    overflow:hidden;
    text-align:center;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:70px;
    margin-bottom:20px;
    animation:fadeIn 2s ease forwards;
}

p{
    max-width:600px;
    opacity:0;
    animation:fadeIn 3s ease forwards;
    animation-delay:1s;
}

button{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:50px;
    margin:20px;
    cursor:pointer;
    transition:0.3s;
}

#yes{
    background:white;
    color:#ff2e63;
    font-weight:bold;
}

#yes:hover{
    transform:scale(1.15);
}

#no{
    background:black;
    color:white;
    position:absolute;
}

@keyframes fadeIn{
    to{opacity:1;}
}
</style>
</head>
<body>

<h1>Nada…</h1>
<p>
Even though miles separate us, my heart finds its way to you every single day.  
Will you be my Valentine? 💖
</p>

<button id="yes" onclick="goNext()">Yes 💘</button>
<button id="no">No 😅</button>

<script>
function goNext(){
    window.location.href="gifts.html";
}

const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseover",function(){
    noBtn.style.left=Math.random()*80+"vw";
    noBtn.style.top=Math.random()*80+"vh";
});
</script>

</body>
</html>
