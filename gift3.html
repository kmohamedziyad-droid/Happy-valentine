<!DOCTYPE html>
<html>
<head>
<title>Forever ❤️</title>
<style>
body{
    margin:0;
    height:100vh;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Segoe UI',sans-serif;
    overflow:hidden;
}

h1{
    font-size:45px;
    animation:glow 2s infinite alternate;
}

p{
    font-size:20px;
}

@keyframes glow{
    from{ text-shadow:0 0 10px red; }
    to{ text-shadow:0 0 40px pink; }
}
</style>
</head>
<body>

<h1>I Love You Forever Nada ❤️</h1>
<p>You are my today, my tomorrow, and my always.</p>

</body>
</html>
