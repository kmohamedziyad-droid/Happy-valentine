<!DOCTYPE html>
<html>
<head>
<title>Forever ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:black;
    font-family:'Poppins',sans-serif;
    color:white;
    text-align:center;
    overflow:hidden;
}

h1{
    font-family:'Playfair Display',serif;
    font-size:55px;
    animation:glow 2s infinite alternate;
}

p{
    font-size:22px;
    max-width:600px;
}

@keyframes glow{
    from{text-shadow:0 0 10px #ff2e63;}
    to{text-shadow:0 0 40px #ff2e63;}
}
</style>
</head>
<body>

<h1>This Is Just The Beginning ❤️</h1>
<p>
One day there won’t be screens between us.  
No distance. No countdowns.  
Just us — finally together.
</p>

</body>
</html>
